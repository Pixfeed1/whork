# Base : auth (interface admin) + caddy.
# Les PROXYS (un par licence) et les POSTES (un par consultant) sont generes
# dans docker-compose.override.yml par provision.py, a partir de config.json.
# Voir apply.sh et la synchro systemd (deploy/talens-sync.*).

services:
  auth:
    build: ./auth
    env_file:
      - .env
    volumes:
      # rw : l'interface admin ecrit licences + comptes dans config.json.
      - ./config.json:/app/config.json
    restart: unless-stopped
    networks: [interne]

  caddy:
    image: caddy:2
    depends_on: [auth]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks: [interne]

networks:
  interne:

volumes:
  caddy_data:
  caddy_config:
