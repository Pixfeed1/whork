# Base : proxy + auth (interface admin) + caddy.
# Les POSTES (seat-N) sont dans docker-compose.override.yml, genere par
# provision.py a partir de users.json (1 compte = 1 poste). Voir apply.sh.

services:
  proxy-groupe1:
    image: ginuerzh/gost:latest
    # Auth Oxylabs par WHITELIST d'IP -> pas de mot de passe. Le PORT = l'IP fixe.
    command: >
      -L=http://:8080
      -F=http://isp.oxylabs.io:${OXY_PORT_G1}
    restart: unless-stopped
    networks: [interne]

  auth:
    build: ./auth
    env_file:
      - .env
    volumes:
      # rw : l'interface admin ecrit les comptes dans users.json.
      - ./users.json:/app/users.json
    restart: unless-stopped
    networks: [interne]

  caddy:
    image: caddy:2
    depends_on: [auth, proxy-groupe1]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks: [interne]

networks:
  interne:

volumes:
  caddy_data:
  caddy_config:
